name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：只允许读取仓库、写入 Pages、使用 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署任务，避免并发发布互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：供未来可能使用 Git 历史的脚本或内容使用
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 必须是 22.23.4 以上：astro 7.4 起 engines 有这个下限
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Markdown plugin tests
        run: npm run test:md

      - name: Build site
        run: npm run build

      # 放在构建之后：图片清单和 WebP 变体是构建时生成的，测试要对着产物验
      - name: Script tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
