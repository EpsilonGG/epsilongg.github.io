name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：只允许读取仓库、写入 Pages、使用 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署任务，避免并发发布互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：供未来可能使用 Git 历史的脚本或内容使用
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 必须是 22.23.4 以上：astro 7.4 起 engines 有这个下限
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Markdown plugin tests
        run: npm run test:md

      # Ci-en 貼り付け用テキスト（`/daily/<期号>.ja.txt`）の記法テスト。
      # 見出し・リンク・文字サイズの書き方は Ci-en 側の都合なので、
      # 「貼ったら崩れる」変更をここで止める。
      - name: Ci-en text tests
        run: npm run test:cien

      - name: Build site
        run: npm run build

      # 死链检查对着产物跑：页面改名之后忘了改链接，构建不会报错，
      # 只有点进去的人看到 404。只查站内（本地文件比对），不联网，不会因为
      # 外站限流或超时让流水线莫名变红。
      - name: Check internal links
        run: npm run links

      # 日报的三个出口（HTML / JSON / TXT）与两个 Feed 的隔离。链接检查看不见
      # 没有别处引用的 JSON 与 TXT，这一条补上：有一份 report.json 就必须有三份产物，
      # 且 /daily/<期号>.json 与正本逐字节相同。
      - name: Check daily outlets
        run: npm run check:daily

      # 放在构建之后：图片清单和 WebP 变体是构建时生成的，测试要对着产物验
      - name: Script tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
