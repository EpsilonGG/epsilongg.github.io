  <h1>AI 整理文章 · 方案已落地</h1>
  <p>
    本页是早期调研方案，功能现已实现。最终实现要点：
  </p>
  <ul>
    <li>不另开独立栏目，全部归在「笔记」一栏（<code>/blog/</code>）。</li>
    <li>用 <code>source: original | ai</code> 一个字段区分内容来源。</li>
    <li>默认列表栏目名「<strong>原创与转载</strong>」，不含 AI 整理文章。</li>
    <li>筛选区「含 AI 整理」滑块勾选后，才把 AI 整理文章并入列表。</li>
    <li><code>source: ai</code> 的文章在列表项与单篇页显示「AI 整理」标记。</li>
  </ul>
  <p>
    完整说明与维护指南请看：
    <a href="notes-maintenance.html">笔记栏目维护指南（notes-maintenance.html）</a>。
  </p>
